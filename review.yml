    falsePositivesRejected:
    - target: https://portal.diversyfund.com/api/openapi.json
      why: >-
        Returns 200 under redirect-following, but the body is the WorkOS AuthKit
        HTML sign-in page. Without -L it is a 307 to the WorkOS authorize
        endpoint. Not a specification.
    - target: https://portal.diversyfund.com/graphql
      why: Same WorkOS auth redirect; no GraphQL endpoint responds.
