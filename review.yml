aid: diversyfund
name: DiversyFund
review:
  question: >-
    Does DiversyFund publish any public, machine-readable API contract or
    developer surface — OpenAPI, GraphQL, AsyncAPI, MCP, or an A2A agent card?
  answer: false
  date: '2026-08-04'
  reviewer: API Evangelist
  method: probed
findings:
  summary: |
    DiversyFund publishes no public API and no developer program. It is a
    San Diego based private-markets investment platform (formed 2016, qualified
    under SEC Regulation A+) that sponsors, develops and manages its own real
    estate and fixed income funds rather than acting as a broker. Its current
    offering, the Distressed Income Fund, is a Reg D 506(c) preferred-equity
    vehicle limited to accredited investors.

    All investor activity happens inside an authenticated single-tenant portal at
    https://portal.diversyfund.com, which is fronted by WorkOS AuthKit: every
    anonymous request to any path on that host — including /api/* and every
    /.well-known/* path — returns HTTP 307 to
    https://api.workos.com/user_management/authorize (or 404). There is no
    developer portal host, no api.* / docs.* / developer.* subdomain (all three
    fail DNS resolution), no API reference page, no SDK in any public package
    registry, no llms.txt, and no /.well-known/ document of any kind.

    The company's public-facing technology posture is that of a buyer of APIs,
    not a publisher of one. The Content-Security-Policy served by the investor
    portal names its vendor dependencies explicitly (see integrationsObserved
    below) — WorkOS for identity, Stripe for payments, DocuSeal for e-signature,
    Sumsub and Parallel Markets for KYC/accreditation, PostHog for analytics,
    Trigger.dev for background jobs, Vercel for hosting, plus OpenAI and Exa.ai.
    None of these are DiversyFund APIs.
