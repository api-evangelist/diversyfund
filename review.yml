    domainSecurity: security/diversyfund-domain-security.yml
    notes:
    - TLSv1.3 on diversyfund.com; certificate valid to 2026-10-25.
    - No HSTS header on the marketing host.
    - DNSSEC not enabled; no CAA records.
    - SPF present; DMARC present but policy is p=none (monitor only).
    - Investor portal sets a strict CSP with frame-ancestors 'none' and a restrictive Permissions-Policy.
  hygieneObserved:
  - finding: production sitemap points at the staging host
    detail: >-
      https://diversyfund.com/sitemap.xml returns 200 but every <loc> is
      https://staging-web.diversyfund.com/..., and robots.txt declares
      "Host: staging-web.diversyfund.com". The staging host is publicly
      reachable (200). This is a crawl/indexing misconfiguration on the
      provider's side, reported here as an observation.
recommendation: >-
  Profile-only listing. There is no API surface to score on contract quality, and
  none should be manufactured. If DiversyFund's stated move toward being a
  technology company produces a public investor or advisor API, the artifacts to
  ask them for first are an OpenAPI at an api.* host, a /.well-known/security.txt
  (RFC 9116), and a status page — the three cheapest things a regulated fintech
  can publish.
