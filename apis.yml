aid: diversyfund
name: DiversyFund
description: 'DiversyFund is a San Diego based private-markets investment platform
  that packages institutional-style fixed income and multifamily real estate offerings
  for individual accredited investors. Formed in 2016 and qualified under SEC Regulation
  A+, the firm acts as sponsor, developer and manager of its own funds rather than
  as a broker, and reports having acquired more than $300 million across 20+ multifamily
  properties for a base of 28,000+ investors. Its current offering, the Distressed
  Income Fund, is a Reg D 506(c) preferred-equity vehicle sold to accredited investors
  with a target allocation of $100K to $1M. Investing is transacted through a private,
  authenticated investor portal at portal.diversyfund.com (WorkOS AuthKit); DiversyFund
  publishes no public developer portal, API documentation, SDKs, or machine-readable
  API contract.'
